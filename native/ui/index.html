<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Native Starter</title>
    <style>
      :root { color-scheme: dark; font: 14px/1.5 Inter, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; --bg:#09090b; --surface:#101113; --text:#fafafa; --muted:#a1a1aa; --border:#292a2e; --accent:#4d80ff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 28px; background: var(--bg); color: var(--text); }
      main { max-width: 560px; margin: 0 auto; }
      section { padding: 24px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); box-shadow: 0 12px 28px #0003; }
      .eyebrow { color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 8px 0 6px; font-size: 21px; font-weight: 650; letter-spacing: -.025em; }
      p { margin: 0; color: var(--muted); line-height: 1.6; }
      button { min-height: 36px; margin-top: 16px; padding: 0 14px; border: 1px solid transparent; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-size: 13px; font-weight: 550; cursor: pointer; }
      button:hover { filter: brightness(1.08); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      pre { padding: 12px; border: 1px solid var(--border); border-radius: 6px; background: color-mix(in srgb, var(--bg) 75%, transparent); white-space: pre-wrap; overflow-wrap: anywhere; }
      @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg:#fafafa; --surface:#fff; --text:#09090b; --muted:#71717a; --border:#e4e4e7; --accent:#3370ff; } section { box-shadow: 0 8px 22px #18181b14; } }
    </style>
  </head>
  <body>
    <main>
      <section>
        <span class="eyebrow">SideWeave plugin</span>
        <h1>Native Starter</h1>
        <p>This page calls the Rust backend through SideWeave's plugin bridge.</p>
        <button id="hello" type="button">Call native plugin</button>
        <pre id="result" aria-live="polite"></pre>
      </section>
    </main>
    <script>
      const result = document.querySelector('#result')
      document.querySelector('#hello').addEventListener('click', async () => {
        result.textContent = 'Calling plugin…'
        try {
          const value = await window.agileTiles.plugin.call('hello', {})
          result.textContent = JSON.stringify(value, null, 2)
        } catch (error) {
          result.textContent = error instanceof Error ? error.message : String(error)
        }
      })
    </script>
  </body>
</html>
