<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Native Starter</title>
    <style>
      :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
      body { margin: 0; padding: 28px; background: #15171c; color: #f4f5f7; }
      main { max-width: 520px; margin: 0 auto; }
      section { padding: 24px; border: 1px solid #343943; border-radius: 18px; background: #20232a; }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { color: #b5bac5; line-height: 1.55; }
      button { padding: 9px 14px; border: 0; border-radius: 9px; cursor: pointer; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Native Starter</h1>
        <p>This page calls the Rust backend through SideWeave's plugin bridge.</p>
        <button id="hello" type="button">Call native plugin</button>
        <pre id="result" aria-live="polite"></pre>
      </section>
    </main>
    <script>
      const result = document.querySelector('#result')
      document.querySelector('#hello').addEventListener('click', async () => {
        result.textContent = 'Calling plugin…'
        try {
          const value = await window.agileTiles.plugin.call('hello', {})
          result.textContent = JSON.stringify(value, null, 2)
        } catch (error) {
          result.textContent = error instanceof Error ? error.message : String(error)
        }
      })
    </script>
  </body>
</html>
