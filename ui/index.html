<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example Weather</title>
    <style>
      :root {
        color-scheme: dark;
        font: 14px/1.5 Inter, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        --bg: #09090b;
        --surface: #101113;
        --text: #fafafa;
        --muted: #a1a1aa;
        --border: #292a2e;
        --accent: #4d80ff;
      }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 28px; background: var(--bg); color: var(--text); }
      main { max-width: 560px; margin: 0 auto; }
      .card { padding: 24px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); box-shadow: 0 12px 28px #0003; }
      .eyebrow { color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 8px 0 6px; font-size: 21px; font-weight: 650; letter-spacing: -.025em; }
      p { margin: 0; color: var(--muted); line-height: 1.6; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      @media (prefers-color-scheme: light) {
        :root { color-scheme: light; --bg: #fafafa; --surface: #fff; --text: #09090b; --muted: #71717a; --border: #e4e4e7; --accent: #3370ff; }
        .card { box-shadow: 0 8px 22px #18181b14; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <span class="eyebrow">SideWeave plugin</span>
        <h1>Example Weather</h1>
        <p>Your SideWeave plugin UI starts here. Keep resources relative to this package.</p>
      </section>
    </main>
  </body>
</html>
